Port 3128
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 100
# Allowlist: a file of anchored host regexes, mounted at run time (per-actor declared hosts).
Filter "/etc/tinyproxy/allow.txt"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
# Only HTTPS CONNECT to 443 (plain HTTP GET still passes through Filter by host).
ConnectPort 443
